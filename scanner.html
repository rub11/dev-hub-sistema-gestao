<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0f16">
  <title>Scanner · DEV HUB</title>

  <style>
    :root {
      --bg:      #0a0f16;
      --surface: #0d131c;
      --line:    rgba(255,255,255,.08);
      --text:    #e6eaf2;
      --muted:   #8b95a7;
      --ok:      #22c55e;
      --err:     #ef4444;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .scan-wrap { display: flex; flex-direction: column; height: 100dvh; }

    .scan-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      flex-shrink: 0;
    }
    .scan-head h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
    .scan-head small { color: var(--muted); font-size: 12px; }

    .btn {
      appearance: none; border: 1px solid transparent; border-radius: 9px;
      padding: 9px 14px; font-size: 13.5px; font-weight: 600;
      font-family: inherit; cursor: pointer; color: #fff;
      transition: background 120ms ease, opacity 120ms ease;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn--primary { background: var(--primary); }
    .btn--danger  { background: #dc2626; }
    .btn--ghost   { background: transparent; color: #c7d0dd; border-color: rgba(255,255,255,.14); }

    #reader { flex: 1; position: relative; background: #000; overflow: hidden; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }

    #reader::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 82%; height: 38%;
      border: 2px solid rgba(255,255,255,.55);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
      pointer-events: none;
    }

    .scan-foot {
      padding: 12px 14px 18px;
      border-top: 1px solid var(--line);
      background: var(--surface);
      flex-shrink: 0;
    }

    .last {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      margin-bottom: 10px;
      font-size: 13px;
      min-height: 40px;
      display: flex; align-items: center;
    }
    .last.ok  { border-left: 3px solid var(--ok); }
    .last.err { border-left: 3px solid var(--err); }

    .manual { display: flex; gap: 8px; }
    .manual input {
      flex: 1; padding: 10px 12px; border-radius: 9px;
      background: #131a24; color: #fff;
      border: 1px solid var(--line);
      font-size: 14px; font-family: inherit;
    }
    .manual input:focus { outline: 2px solid var(--primary); }

    .scan-actions { display: flex; gap: 8px; margin-top: 8px; }
    .scan-actions .btn { flex: 1; }

    .hidden { display: none !important; }

    .encerrada {
      position: fixed; inset: 0; z-index: 20;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px; text-align: center;
    }
    .encerrada h2 { font-size: 20px; margin: 0 0 8px; }
    .encerrada p  { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  </style>
</head>
<body>
  <div class="scan-wrap">
    <header class="scan-head">
      <div>
        <h1>Scanner</h1>
        <small id="sessao-info">Conectando…</small>
      </div>
      <button type="button" class="btn btn--ghost" id="btn-sair">Sair</button>
    </header>

    <div id="reader"></div>

    <footer class="scan-foot">
      <div class="last" id="last-scan">Aguardando primeiro item…</div>

      <div class="manual">
        <input type="text" id="manual-input" inputmode="numeric"
               placeholder="Digitar código de barras…" autocomplete="off">
        <button type="button" class="btn btn--primary" id="manual-add">Add</button>
      </div>

      <div class="scan-actions">
        <button type="button" class="btn btn--ghost"  id="btn-remove-last">Remover último</button>
        <button type="button" class="btn btn--danger" id="btn-encerrar">Encerrar</button>
      </div>
    </footer>
  </div>

  <div class="encerrada hidden" id="tela-encerrada">
    <h2>Sessão encerrada</h2>
    <p>O desktop finalizou ou encerrou esta sessão de scanner.</p>
    <button type="button" class="btn btn--primary" onclick="location.reload()">Voltar</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
