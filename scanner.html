<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f16">
  <title>Scanner · DEV HUB</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #06090f;
      color: #e6eaf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(10,15,22,.9);
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0; font-size: 15px; font-weight: 600; color: #f5f7fb;
      letter-spacing: .2px;
    }
    header .badge {
      font-size: 11px; padding: 3px 8px; border-radius: 6px;
      background: rgba(59,130,246,.15);
      color: #93b6ff;
      border: 1px solid rgba(59,130,246,.25);
      font-weight: 600;
    }
    body.mode-products header .badge {
      background: rgba(168,85,247,.15);
      color: #d8b4fe;
      border-color: rgba(168,85,247,.28);
    }

    .video-wrap {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }
    #scanner-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    #scanner-canvas { display: none; }

    .overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .reticle {
      width: 78%; max-width: 420px;
      aspect-ratio: 3 / 2;
      border-radius: 14px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
    }
    .reticle::before,
    .reticle::after {
      content: '';
      position: absolute;
      width: 34px; height: 34px;
      border: 3px solid #3b82f6;
      border-radius: 8px;
    }
    .reticle::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
    .reticle::after  { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
    body.mode-products .reticle::before,
    body.mode-products .reticle::after { border-color: #a855f7; }

    .laser {
      position: absolute; left: 8%; right: 8%; top: 50%;
      height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: scanline 2.2s ease-in-out infinite;
      filter: drop-shadow(0 0 6px #3b82f6);
    }
    @keyframes scanline {
      0%, 100% { transform: translateY(-42px); opacity: .55; }
      50%      { transform: translateY(42px);  opacity: 1; }
    }

    footer {
      flex-shrink: 0;
      background: #0a0f16;
      border-top: 1px solid rgba(255,255,255,.06);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    #scanner-status {
      font-size: 13.5px;
      color: #b7c0cf;
      margin: 0 0 10px;
      min-height: 20px;
      text-align: center;
      transition: color .15s ease;
    }
    #scanner-status[data-kind="ok"]  { color: #86efac; }
    #scanner-status[data-kind="err"] { color: #fca5a5; }
    #scanner-status[data-kind="info"]{ color: #93b6ff; }

    #scanner-last {
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      color: #b7c0cf;
      margin: 0 0 12px;
      min-height: 38px;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      word-break: break-word;
      transition: all .15s ease;
    }
    #scanner-last[data-kind="ok"]  {
      background: rgba(34,197,94,.08);
      border-color: rgba(34,197,94,.22);
      color: #86efac;
    }
    #scanner-last[data-kind="err"] {
      background: rgba(239,68,68,.08);
      border-color: rgba(239,68,68,.22);
      color: #fca5a5;
    }

    .controls {
      display: flex; gap: 8px;
    }
    .controls button {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: #c7d0dd;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s ease;
    }
    .controls button:active { background: rgba(255,255,255,.08); }
    .controls button[hidden] { display: none; }

    /* Aviso de orientação (opcional) */
    @media (orientation: landscape) and (max-height: 500px) {
      header h1 { font-size: 13px; }
      .reticle  { width: 55%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Scanner DEV HUB</h1>
    <span class="badge" id="scanner-badge">vendas</span>
  </header>

  <div class="video-wrap">
    <video id="scanner-video" playsinline muted autoplay></video>
    <canvas id="scanner-canvas"></canvas>

    <div class="overlay">
      <div class="reticle">
        <div class="laser"></div>
      </div>
    </div>
  </div>

  <footer>
    <p id="scanner-status" data-kind="info">Inicializando…</p>
    <p id="scanner-last">—</p>

    <div class="controls">
      <button type="button" id="scanner-torch" hidden>🔦 Lanterna</button>
      <button type="button" id="scanner-switch">🔄 Trocar</button>
      <button type="button" id="scanner-stop">⏸ Pausar</button>
    </div>
  </footer>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config + cliente Supabase (o mesmo padrão do seu projeto) -->
  <script src="js/supabase.js"></script>

  <!-- Lógica do scanner -->
  <script src="js/scanner.js"></script>

  <script>
    // Mostra o badge conforme o modo
    (function () {
      const params = new URLSearchParams(location.search);
      const badge = document.getElementById('scanner-badge');
      if (params.get('mode') === 'products') {
        badge.textContent = 'produtos';
      }
    })();
  </script>
</body>
</html>
