  <div class="app__body">
    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menu-toggle"

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"

               style="width:14px;height:14px;display:inline;vertical-align:-2px;margin-right:6px">

            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Administração
        </p>
        <h1 class="page-head__title">Central de Administração</h1>
        <p class="page-head__sub">Escolha a área que deseja configurar ou gerenciar.</p>
      </div>

      <div class="adm-grid" id="adm-grid">
