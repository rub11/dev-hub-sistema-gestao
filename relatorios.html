<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Relatórios · DEV HUB</title>

  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/clientes.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/relatorios.css" />

  <script>
    (function () {
      try {
        if (!/[?&]blocked=1/.test(location.search)) {
          document.documentElement.classList.add('layout-topnav');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="layout-topnav" data-page="reports">

  <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

  <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="app__body">
    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menu-toggle"
              aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" />
        </svg>
      </button>
      <span class="topbar__brand">DEV HUB</span>
      <div class="topbar__actions">
        <button type="button" class="icon-btn" id="notifications-btn"
                aria-label="Notificações (em breve)" title="Em breve" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
            <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
          </svg>
        </button>
        <div class="user-menu">
          <button type="button" class="user-menu__trigger" id="user-menu-trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-panel">
            <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
            <span class="user-menu__meta">
              <span class="user-menu__name" id="user-name">Carregando…</span>
              <span class="user-menu__role" id="user-role"></span>
            </span>
            <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
            <a class="menu-item" role="menuitem" href="configuracoes.html">Configurações</a>
            <div class="menu-item__sep" role="separator"></div>
            <button type="button" class="menu-item menu-item--danger" role="menuitem" data-action="logout">
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="main">
      <div id="global-alert" class="alert" role="alert" hidden></div>

      <!-- HEADER DA CENTRAL -->
      <div class="page-head page-head--split" style="margin-bottom: 24px;">
        <div class="page-head__main">
          <p class="page-head__eyebrow">
            <span id="greeting-name">Olá</span>
            <span class="role-badge" id="greeting-role" hidden></span>
          </p>
          <h1 class="page-head__title">Central de Relatórios</h1>
          <p class="page-head__sub">Acesse, filtre e exporte relatórios gerenciais, financeiros e de auditoria.</p>
        </div>
      </div>

      <!-- BARRA DE BUSCA -->
      <div style="display:flex; justify-content:center; margin-bottom: 32px;">
        <div style="position:relative; width:100%; max-width: 640px;">
          <svg style="position:absolute; left:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; color:var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="search" id="report-search" placeholder="Buscar relatório (ex: DRE, Inadimplência, Fluxo de Caixa)..." 
                 style="width:100%; height:48px; padding:0 16px 0 48px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); font-family:inherit; font-size:14.5px; outline:none; transition:border-color 0.2s;"
                 onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'" />
        </div>
      </div>

      <!-- GRID DE CARDS -->
      <section class="reports-grid" id="reports-grid">
        <!-- Injetado via JS -->
      </section>

    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <!-- Scripts Base -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  
  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/permission-modal.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/favorites-modal.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
  <script src="js/nav/favorites.js"></script>
  <script src="js/nav/main.js"></script>

  <!-- Script exclusivo da Central de Relatórios -->
  <script src="js/relatorios/central.js"></script>
</body>
</html>
