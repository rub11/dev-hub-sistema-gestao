<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/clientes.css" />
  <link rel="stylesheet" href="css/theme.css" />

  <script>
    (function () {
      try {
        if (!/[?&]blocked=1/.test(location.search)) {
          document.documentElement.classList.add('layout-topnav');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="layout-topnav" data-page="approvals">

  <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

  <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="app__body">

    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menu-toggle"
              aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" />
        </svg>
      </button>

      <span class="topbar__brand">DEV HUB</span>

      <div class="topbar__actions">
        <button type="button" class="icon-btn" id="notifications-btn"
                aria-label="Notificações (em breve)" title="Em breve" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
            <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
          </svg>
        </button>

        <div class="user-menu">
          <button type="button" class="user-menu__trigger" id="user-menu-trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-panel">
            <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
            <span class="user-menu__meta">
              <span class="user-menu__name" id="user-name">Carregando…</span>
              <span class="user-menu__role" id="user-role"></span>
            </span>
            <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
            <a class="menu-item" role="menuitem" href="configuracoes.html">Configurações</a>
            <div class="menu-item__sep" role="separator"></div>
            <button type="button" class="menu-item menu-item--danger" role="menuitem" data-action="logout">
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="main">

      <div id="global-alert" class="alert" role="alert" hidden></div>

      <div class="page-head">
        <p class="page-head__eyebrow">
          <span id="greeting-name">Olá</span>
          <span class="role-badge" id="greeting-role" hidden></span>
        </p>
        <h1 class="page-head__title">Aprovações</h1>
        <p class="page-head__sub">
          Revise e aprove produtos cadastrados pelo estoque.
        </p>
      </div>

      <!-- =====================================================
           PRODUTOS PENDENTES
           ===================================================== -->
      <section class="panel" aria-labelledby="aprovar-produtos-title"
               style="margin-bottom:24px;">
        <div class="panel__head toolbar">
          <div class="toolbar__info">
            <h2 class="panel__title" id="aprovar-produtos-title">
              Produtos aguardando aprovação
              <span class="badge badge--warning" id="aprovar-produtos-badge"
                    style="margin-left:8px;" hidden>0</span>
            </h2>
            <p class="panel__sub" id="aprovar-produtos-count">Carregando…</p>
          </div>
        </div>

        <div class="panel__body" style="padding:16px 20px;">
          <div id="aprovar-produtos-list">
            <div class="state-block state-block--compact">
              <span class="spinner" aria-hidden="true"></span>
              <p>Carregando produtos pendentes…</p>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <!-- =========================================================
       Scripts
       ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/ui-confirm.js"></script>

  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/permission-modal.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
  <script src="js/nav/main.js"></script>

  <!-- Módulo de aprovações -->
  <script src="js/aprovacoes/produtos-pendentes.js"></script>

  <!-- Sessão / user info básica (esse arquivo não existia ainda) -->
  <script>
    (function () {
      'use strict';
      document.addEventListener('DOMContentLoaded', async () => {
        const Auth = window.Auth;
        if (!Auth || !Auth.isConfigured() || !window.db) return;

        const session = await Auth.requireSession().catch(() => null);
        if (!session) return;

        const profile = await Auth.getProfile(session.user.id);

        const meta = session.user.user_metadata || {};
        const fullName =
          (profile && profile.name) ||
          meta.name || meta.full_name ||
          (session.user.email ? session.user.email.split('@')[0] : '') ||
          'Usuário';

        const roleText = window.Auth.roleLabel((profile && profile.role) || meta.role || '');
        const firstName = String(fullName).trim().split(/\s+/)[0] || 'Usuário';
        const initial = firstName.charAt(0).toUpperCase() || '?';

        const setText = (id, txt) => {
          const el = document.getElementById(id);
          if (el) el.textContent = txt;
        };

        setText('user-avatar', initial);
        setText('user-name', fullName);
        setText('user-role', roleText || session.user.email || '');
        setText('greeting-name', 'Olá, ' + firstName);

        const roleBadge = document.getElementById('greeting-role');
        if (roleBadge) {
          if (roleText) {
            roleBadge.textContent = roleText;
            roleBadge.hidden = false;
          } else {
            roleBadge.hidden = true;
          }
        }

        // Logout
        document.querySelectorAll('[data-action="logout"]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            await window.Auth.signOut();
          });
        });

        // Sidebar / user menu
        setupSidebar();
        setupUserMenu();

        function setupSidebar() {
          const toggle = document.getElementById('menu-toggle');
          const overlay = document.getElementById('sidebar-overlay');
          const sidebar = document.getElementById('sidebar');
          if (!toggle || !overlay || !sidebar) return;

          const open = () => {
            document.body.classList.add('sidebar-open');
            toggle.setAttribute('aria-expanded', 'true');
            overlay.hidden = false;
          };
          const close = () => {
            document.body.classList.remove('sidebar-open');
            toggle.setAttribute('aria-expanded', 'false');
            overlay.hidden = true;
          };

          toggle.addEventListener('click', () => {
            document.body.classList.contains('sidebar-open') ? close() : open();
          });
          overlay.addEventListener('click', close);
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') close();
          });
        }

        function setupUserMenu() {
          const trigger = document.getElementById('user-menu-trigger');
          const panel = document.getElementById('user-menu-panel');
          if (!trigger || !panel) return;

          trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            panel.hidden = !panel.hidden;
            trigger.setAttribute('aria-expanded', String(!panel.hidden));
          });
          document.addEventListener('click', (e) => {
            if (panel.hidden) return;
            if (panel.contains(e.target) || trigger.contains(e.target)) return;
            panel.hidden = true;
            trigger.setAttribute('aria-expanded', 'false');
          });
        }
      });
    })();
  </script>

</body>
</html>
