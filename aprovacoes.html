<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aprovações · DEV HUB</title>

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/aprovacoes.css" />
</head>

<body data-page="aprovacoes">
  <div class="app__body">
    <main class="content appr-content">

      <!-- ============== HEADER ============== -->
      <header class="appr-head">
        <div class="appr-head__text">
          <span class="appr-head__eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 12l2 2 4-4"/>
              <path d="M21 12c0 5-4 8-9 8-5 0-9-3-9-8s4-8 9-8c5 0 9 3 9 8z"/>
            </svg>
            Administração
          </span>
          <h1 class="appr-head__title">Aprovações pendentes</h1>
          <p class="appr-head__sub">Compras aguardando sua aprovação para seguir ao recebimento.</p>
        </div>
        <div class="appr-head__actions">
          <button type="button" class="appr-btn appr-btn--ghost" id="appr-refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <path d="M21 3v6h-6"/>
            </svg>
            Atualizar
          </button>
        </div>
      </header>

      <!-- ============== KPIs ============== -->
      <section class="appr-kpis" id="appr-kpis" aria-label="Resumo"></section>

      <!-- ============== LISTA ============== -->
      <section class="appr-panel" aria-label="Compras para aprovar">
        <div class="appr-panel__scroll">
          <table class="appr-table">
            <thead>
              <tr>
                <th scope="col">Pedido</th>
                <th scope="col">Solicitante</th>
                <th scope="col">Fornecedor</th>
                <th scope="col">Enviada em</th>
                <th scope="col" class="cell--num">Valor</th>
                <th scope="col">Itens</th>
                <th scope="col" class="cell--right">Ações</th>
              </tr>
            </thead>
            <tbody id="appr-tbody">
              <tr><td colspan="7"><div class="appr-loading">Carregando...</div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <!-- aprovacoes — ordem importa! -->
  <script src="js/aprovacoes/state.js"></script>
  <script src="js/aprovacoes/api.js"></script>
  <script src="js/aprovacoes/render.js"></script>
  <script src="js/aprovacoes/modals.js"></script>
  <script src="js/aprovacoes/init.js"></script>
</body>
</html>
</body>
</html>
