<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · DEV HUB</title>

  <script src="js/theme.js"></script>

  <meta name="description" content="Acesse o painel do DEV HUB." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body class="login-page">

  <main class="login">

    <!-- LADO ESQUERDO: FORMULÁRIO -->
    <section class="login__panel">
      <div class="login__panel-inner">

        <header class="login__header">
          <h1 class="login__title">LOGIN</h1>
          <p class="login__subtitle">Acesse sua conta para continuar.</p>
        </header>

        <form id="login-form" class="login__form" novalidate autocomplete="off">

          <div id="login-fields">

            <!-- Código da empresa -->
            <div class="field">
              <label for="company-code">CÓDIGO DA EMPRESA</label>
              <div class="field__control">
                <input
                  type="text"
                  id="company-code"
                  name="company_code"
                  autocomplete="off"
                  placeholder="Ex: EMP-0001"
                  spellcheck="false"
                  maxlength="50"
                />
              </div>
            </div>

            <!-- E-mail -->
            <div class="field">
              <label for="email">E-MAIL</label>
              <div class="field__control">
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="off"
                  placeholder="Digite seu e-mail"
                  spellcheck="false"
                  required
                />
              </div>
            </div>

            <!-- Senha -->
            <div class="field">
              <label for="password">SENHA</label>
              <div class="field__control">
                <input
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="new-password"
                  placeholder="Digite sua senha"
                  required
                />
                <button
                  type="button"
                  class="pw-toggle"
                  id="toggle-password"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg class="pw-toggle__icon pw-toggle__icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="pw-toggle__icon pw-toggle__icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.9 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4.1" />
                    <path d="M6.3 6.3A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.2-.95" />
                    <path d="m3 3 18 18" />
                  </svg>
                </button>
              </div>
            </div>

          </div>

          <!-- PICKER DE EMPRESA -->
          <div id="company-picker" hidden>
            <div class="field">
              <label for="company-select">ESCOLHA A EMPRESA</label>
              <div class="field__control">
                <select id="company-select" class="login__select"></select>
              </div>
              <p class="field__hint">Sua conta tem acesso a mais de uma empresa.</p>
            </div>
            <button type="button" class="btn btn--ghost btn--block" id="back-to-login" hidden>
              ← Voltar
            </button>
          </div>

          <p id="login-feedback" class="feedback" role="alert" aria-live="polite" hidden></p>

          <button type="submit" class="btn btn--primary btn--block" id="login-submit">
            <span class="btn__label">ENTRAR</span>
            <span class="btn__spinner" aria-hidden="true"></span>
          </button>

        </form>

        <footer class="login__footer">
          <p>Esqueceu a senha? <a href="#">Cadastre-se</a></p>
        </footer>

      </div>
    </section>

    <!-- LADO DIREITO: IMAGEM DA RAPOSA -->
    <section class="login__aside">
      <img 
        src="img/logo-menor.jpeg" 
        alt="Fundo decorativo" 
        class="login__aside-img"
      />
      
      <!-- Filtro escuro e texto por cima -->
      <div class="login__aside-overlay">
        <div class="login__aside-content">
          <h2>Gestão de verdade<br>é com a Dev Ruby</h2>
          <p>Gerencie sua empresa com a plataforma mais inteligente do mercado.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/global-utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>


</body>
</html>
