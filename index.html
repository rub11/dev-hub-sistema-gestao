<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · DEV HUB</title>
  <!-- Tema ANTES da CSS (evita flash) -->
  <script src="js/theme.js"></script>
  <meta name="description" content="Acesse o painel do DEV HUB." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page">

  <main class="login">

    <!-- Painel institucional (oculto no mobile) -->
    <section class="login__aside">
      <div class="login__aside-inner">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">DH</span>
          <span class="brand__name">DEV HUB</span>
        </div>

        <div class="login__aside-text">
          <h2>Gestão de vendas com clareza.</h2>
          <p>Acesse o painel para acompanhar sua operação em tempo real.</p>
        </div>
      </div>

      <p class="login__aside-foot">DEV HUB · Sistema de gestão</p>
    </section>

    <!-- Formulário -->
    <section class="login__panel">
      <div class="login__panel-inner">

        <div class="login__brand-mobile">
          <span class="brand__mark" aria-hidden="true">DH</span>
          <span class="brand__name">DEV HUB</span>
        </div>

        <h1 class="login__title">Acesse sua conta</h1>
        <p class="login__subtitle">Entre com suas credenciais para continuar.</p>

        <form id="login-form" class="login__form" novalidate>

          <!-- Código da empresa -->
          <div class="field">
            <label for="company-code">Código da empresa</label>
            <input
              type="text"
              id="company-code"
              name="company_code"
              autocomplete="organization"
              placeholder="Ex.: EMP-0001"
              spellcheck="false"
              maxlength="50"
              required
            />
          </div>

          <!-- E-mail -->
          <div class="field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              placeholder="voce@empresa.com"
              spellcheck="false"
              required
            />
          </div>

          <!-- Senha -->
          <div class="field">
            <label for="password">Senha</label>
            <div class="field__control">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                id="toggle-password"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="pw-toggle__icon pw-toggle__icon--show" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="pw-toggle__icon pw-toggle__icon--hide" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <path d="M9.9 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4.1" />
                  <path d="M6.3 6.3A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.2-.95" />
                  <path d="m3 3 18 18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Feedback -->
          <p id="login-feedback" class="feedback" role="alert" aria-live="polite" hidden></p>

          <!-- Botão -->
          <button type="submit" class="btn btn--primary btn--block" id="login-submit">
            <span class="btn__label">ENTRAR</span>
            <span class="btn__spinner" aria-hidden="true"></span>
          </button>

        </form>

        <p class="login__foot">Acesso restrito a usuários autorizados.</p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
