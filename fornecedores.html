<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fornecedores · DEV HUB</title>

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/compras.css" />
</head>

<body data-page="fornecedores">
  <div class="app__body">

    <main class="content cmp-content">

      <!-- ====================== HEADER ====================== -->
      <header class="cmp-page-head">
        <div class="cmp-page-head__text">
          <a href="compras.html" class="cmp-page-head__eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            Voltar para compras
          </a>
          <h1 class="cmp-page-head__title">Fornecedores</h1>
          <p class="cmp-page-head__sub">Cadastro de fornecedores usados nas compras.</p>
        </div>

        <div class="cmp-page-head__actions">
          <button type="button" class="cmp-btn cmp-btn--primary" id="forn-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Novo fornecedor</span>
          </button>
        </div>
      </header>

      <!-- ====================== TOOLBAR ====================== -->
      <section class="cmp-toolbar" aria-label="Busca">
        <label class="cmp-search" for="forn-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input
            type="search"
            id="forn-search"
            placeholder="Buscar por nome ou CNPJ..."
            autocomplete="off"
          />
        </label>
      </section>

      <!-- ====================== TABELA ====================== -->
      <section class="cmp-panel" aria-label="Lista de fornecedores">
        <div class="cmp-panel__scroll">
          <table class="cmp-table" style="min-width: 720px">
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">CNPJ / CPF</th>
                <th scope="col">Telefone</th>
                <th scope="col">E-mail</th>
                <th scope="col" class="cell--right">Ações</th>
              </tr>
            </thead>
            <tbody id="forn-tbody">
              <!-- JS preenche -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav/config.js"></script>
<script src="js/nav/state.js"></script>
<script src="js/nav/roles.js"></script>
<script src="js/nav/styles.js"></script>
<script src="js/nav/permission-modal.js"></script>
<script src="js/nav/tabs.js"></script>
<script src="js/nav/module-menu.js"></script>
<script src="js/nav/notifications.js"></script>
<script src="js/nav/user-menu.js"></script>
<script src="js/nav/search.js"></script>
<script src="js/nav/org-switcher.js"></script>
<script src="js/nav/bar.js"></script>
<script src="js/nav/favorites.js"></script>
<script src="js/nav/main.js"></script>
  <script src="js/permissions.js"></script>

  <!-- compras — ordem importa! -->
  <script src="js/compras/state.js"></script>
  <script src="js/compras/api.js"></script>
  <script src="js/compras/supplier-modal.js"></script>
  <script src="js/compras/list.js"></script>
  <script src="js/compras/nova.js"></script>
  <script src="js/compras/receber.js"></script>
  <script src="js/compras/fornecedores.js"></script>
  <script src="js/compras/init.js"></script>
</body>
</html>
</body>
</html>
