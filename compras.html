<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compras · DEV HUB</title>

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/clientes.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/custom-select.css" />
  <link rel="stylesheet" href="css/compras.css" />

  <script>
    (function () {
      try {
        if (!/[?&]blocked=1/.test(location.search)) {
          document.documentElement.classList.add('layout-topnav');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="layout-topnav" data-page="compras">

  <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

  <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="app__body">

    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menu-toggle"
              aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" /></svg>
      </button>

      <span class="topbar__brand">DEV HUB</span>

      <div class="topbar__actions">
        <button type="button" class="icon-btn" id="notifications-btn"
                aria-label="Notificações (em breve)" title="Em breve" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
            <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
          </svg>
        </button>

        <div class="user-menu">
          <button type="button" class="user-menu__trigger" id="user-menu-trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-panel">
            <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
            <span class="user-menu__meta">
              <span class="user-menu__name" id="user-name">Carregando…</span>
              <span class="user-menu__role" id="user-role"></span>
            </span>
            <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
            <a class="menu-item" role="menuitem" href="configuracoes.html">Configurações</a>
            <div class="menu-item__sep" role="separator"></div>
            <button type="button" class="menu-item menu-item--danger" role="menuitem" data-action="logout">
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content cmp-content" id="main">

      <div id="global-alert" class="alert" role="alert" hidden></div>

      <div class="page-head">
        <p class="page-head__eyebrow">
          <span id="greeting-name">Olá</span>
          <span class="role-badge" id="greeting-role" hidden></span>
        </p>
        <h1 class="page-head__title">Compras</h1>
        <p class="page-head__sub">Gerencie pedidos, fornecedores e recebimentos.</p>
      </div>

      <!-- ====================== HEADER ====================== -->
      <header class="cmp-page-head" style="margin-top:8px;">
        <div class="cmp-page-head__text">
          <span class="cmp-page-head__eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h9.2a2 2 0 0 0 2-1.6L22 7H6"/>
              <circle cx="9" cy="20" r="1.4"/>
              <circle cx="18" cy="20" r="1.4"/>
            </svg>
            Suprimentos
          </span>
        </div>

        <div class="cmp-page-head__actions">
          <a href="fornecedores.html" class="cmp-btn cmp-btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/>
              <path d="M15 21V9h4a2 2 0 0 1 2 2v10"/><path d="M9 7h2M9 11h2M9 15h2"/>
            </svg>
            <span>Fornecedores</span>
          </a>
          <a href="compras-nova.html" class="cmp-btn cmp-btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Nova compra</span>
          </a>
        </div>
      </header>

      <!-- ====================== TOOLBAR ====================== -->
      <section class="cmp-toolbar" aria-label="Filtros">
        <label class="cmp-search" for="cmp-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" id="cmp-search" placeholder="Buscar por código, fornecedor..." autocomplete="off" />
        </label>

        <select id="cmp-status-filter" class="control-select cmp-toolbar__select" aria-label="Filtrar por status">
          <option value="">Todos os status</option>
          <option value="rascunho">Rascunho</option>
          <option value="aguardando_aprovacao">Aguardando aprovação</option>
          <option value="pendente_recebimento">Pendente de recebimento</option>
          <option value="recebida_parcial">Recebida parcial</option>
          <option value="recebida">Recebida</option>
          <option value="paga">Paga</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </section>

      <!-- ====================== TABELA ====================== -->
      <section class="cmp-panel" aria-label="Lista de compras">
        <div class="cmp-panel__scroll">
          <table class="cmp-table">
            <thead>
              <tr>
                <th scope="col">Código</th>
                <th scope="col">Fornecedor</th>
                <th scope="col">Data</th>
                <th scope="col" class="cell--num">Valor</th>
                <th scope="col">Pagamento</th>
                <th scope="col">Status</th>
                <th scope="col" class="cell--right">Ações</th>
              </tr>
            </thead>
            <tbody id="cmp-tbody">
              <!-- JS preenche -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>

  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/permission-modal.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/favorites-modal.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
  <script src="js/nav/favorites.js"></script>
  <script src="js/nav/main.js"></script>

  <script src="js/custom-select.js"></script>

  <script src="js/compras/state.js"></script>
  <script src="js/compras/api.js"></script>
  <script src="js/compras/supplier-modal.js"></script>
  <script src="js/compras/list.js"></script>
  <script src="js/compras/init.js"></script>
</body>
</html>
