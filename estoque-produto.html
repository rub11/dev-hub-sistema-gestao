<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhes do Produto · DEV HUB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/estoque.css" />
  
  <script src="js/theme.js"></script>
  
  <style>
    body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: var(--bg);
    }

    .app__body {
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    main.content {
      width: 100% !important;
      display: flex !important;
      justify-content: center !important;
      padding-top: 70px !important; /* Reduzido */
      padding-bottom: 60px !important;
    }

    .prod-page-wrapper {
      width: 100% !important;
      max-width: 1000px !important;
      padding: 0 24px !important;
      box-sizing: border-box !important;
    }

    /* BOTÃO VOLTAR - ALINHADO À ESQUERDA */
    .back-link-wrapper {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 24px;
    }

    .mov-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 40px;
    }

    .mov-header .page-head__title { font-size: 32px; font-weight: 800; margin: 0 0 8px 0; color: var(--text); letter-spacing: -0.02em; }
    .mov-header .page-head__sub { font-size: 15px; color: var(--text-muted); margin: 0; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }

    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 32px; font-weight: 700; margin-top: 8px; color: var(--text); }

    .cmp-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .cmp-section__title { font-size: 16px; font-weight: 700; margin: 0 0 20px 0; color: var(--text); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 14px 16px; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); background: var(--surface-2); }
    .data-table td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background 0.15s; }
    .data-table tbody tr:hover { background: var(--surface-2); }
  </style>
</head>
<body data-page="estoque">
  
  <div class="app__body">
    <main class="content">
      <div class="prod-page-wrapper">
        
        <!-- BOTÃO VOLTAR NO CANTO SUPERIOR ESQUERDO -->
        <div class="back-link-wrapper">
          <a href="estoque.html" style="color:var(--text-muted); text-decoration:none; display:flex; align-items:center; gap:6px; font-weight:600; font-size: 13px; transition: color 0.2s;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Voltar para o estoque
          </a>
        </div>

        <!-- TÍTULO CENTRALIZADO -->
        <header class="mov-header">
          <h1 class="page-head__title" id="prod-name">Carregando...</h1>
          <p class="page-head__sub" id="prod-code">SKU: —</p>
        </header>

        <div id="loading-msg" class="cmp-loading" style="text-align:center; padding: 40px; color: var(--text-muted);">Carregando informações do produto...</div>

        <div id="prod-content" hidden>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Estoque Atual</span>
              <div class="stat-value" id="prod-stock">0</div>
            </div>
            <div class="stat-card">
              <span class="stat-label">Estoque Mínimo</span>
              <div class="stat-value" id="prod-min-stock">0</div>
            </div>
            <div class="stat-card">
              <span class="stat-label">Status</span>
              <div id="prod-status" style="margin-top: 12px;"></div>
            </div>
          </div>

          <div class="cmp-section">
            <h2 class="cmp-section__title">Histórico deste Produto</h2>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Quantidade</th>
                    <th>Anterior</th>
                    <th>Novo</th>
                    <th>Documento</th>
                    <th>Usuário</th>
                  </tr>
                </thead>
                <tbody id="prod-history-body">
                  <!-- JS injeta aqui -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/permission-modal.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/favorites-modal.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
  <script src="js/nav/favorites.js"></script>
  <script src="js/nav/main.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/estoque-produto.js"></script>
</body>
</html>
