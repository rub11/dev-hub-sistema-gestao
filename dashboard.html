<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · DEV HUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body data-page="dashboard">

    <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

    <!-- ================= SIDEBAR ================= -->
    


<aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
    



    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <!-- ================= ÁREA PRINCIPAL ================= -->
    <div class="app__body">

        <header class="topbar">
            <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-label="Abrir menu"
                aria-expanded="false" aria-controls="sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" />
                </svg>
            </button>

            <span class="topbar__brand">DEV HUB</span>

            <div class="topbar__actions">

                <button type="button" class="icon-btn" id="notifications-btn" aria-label="Notificações (em breve)"
                    title="Em breve" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
                        <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
                    </svg>
                </button>

                <div class="user-menu">
                    <button type="button" class="user-menu__trigger" id="user-menu-trigger" aria-haspopup="true"
                        aria-expanded="false" aria-controls="user-menu-panel">
                        <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
                        <span class="user-menu__meta">
                            <span class="user-menu__name" id="user-name">Carregando…</span>
                            <span class="user-menu__role" id="user-role"></span>
                        </span>
                        <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>

                    <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
                        <button type="button" class="menu-item" role="menuitem" aria-disabled="true">
                            Perfil <span class="menu-item__tag">Em breve</span>
                        </button>
                        <button type="button" class="menu-item" role="menuitem" aria-disabled="true">
                            Configurações <span class="menu-item__tag">Em breve</span>
                        </button>
                        <div class="menu-item__sep" role="separator"></div>
                        <button type="button" class="menu-item menu-item--danger" role="menuitem" data-action="logout">
                            Sair
                        </button>
                    </div>
                </div>

            </div>
        </header>

        <main class="content" id="main">

            <div id="global-alert" class="alert" role="alert" hidden></div>

            <div class="page-head">
                <p class="page-head__eyebrow">
                    <span id="greeting-name">Olá</span>
                    <span class="role-badge" id="greeting-role" hidden></span>
                </p>
                <h1 class="page-head__title">Dashboard</h1>
                <p class="page-head__sub">Visão geral do seu negócio</p>
            </div>

            <!-- ---------- Indicadores ---------- -->
            <section class="stats" aria-label="Indicadores do negócio">

                <article class="stat">
                    <div class="stat__top">
                        <span class="stat__label">Vendas hoje</span>
                        <span class="stat__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="20" r="1.4" />
                                <circle cx="18" cy="20" r="1.4" />
                                <path
                                    d="M2.5 3.5h2.3l2.3 11.6a1.8 1.8 0 0 0 1.8 1.4h8.8a1.8 1.8 0 0 0 1.8-1.4L21 7.5H6" />
                            </svg>
                        </span>
                    </div>
                    <p class="stat__value" id="stat-sales-today">—</p>
                </article>

                <article class="stat">
                    <div class="stat__top">
                        <span class="stat__label">Vendas no mês</span>
                        <span class="stat__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
                                <path d="M3 9.5h18M8 3v3M16 3v3" />
                            </svg>
                        </span>
                    </div>
                    <p class="stat__value" id="stat-sales-month">—</p>
                </article>

                <article class="stat">
                    <div class="stat__top">
                        <span class="stat__label">Clientes</span>
                        <span class="stat__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20" />
                                <circle cx="9" cy="7.5" r="3.5" />
                                <path d="M22 20v-1.5a4 4 0 0 0-3-3.87" />
                                <path d="M16.5 4.13a4 4 0 0 1 0 7.75" />
                            </svg>
                        </span>
                    </div>
                    <p class="stat__value" id="stat-customers">—</p>
                </article>

                <article class="stat">
                    <div class="stat__top">
                        <span class="stat__label">Produtos</span>
                        <span class="stat__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="m21 8-9-5-9 5v8l9 5 9-5z" />
                                <path d="m3 8 9 5 9-5" />
                                <path d="M12 21v-8" />
                            </svg>
                        </span>
                    </div>
                    <p class="stat__value" id="stat-products">—</p>
                </article>

            </section>

            <!-- ---------- Últimas vendas ---------- -->
            <section class="panel" aria-labelledby="latest-sales-title">
                <div class="panel__head">
                    <div>
                        <h2 class="panel__title" id="latest-sales-title">Últimas vendas</h2>
                        <p class="panel__sub">Os 5 registros mais recentes</p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <caption class="sr-only">Últimas vendas registradas</caption>
                        <thead>
                            <tr>
                                <th scope="col">Nº</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Data</th>
                                <th scope="col" class="cell--num">Valor</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody id="sales-body">
                            <tr id="sales-empty" class="table-empty">
                                <td colspan="5">Carregando…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>

</html>
