<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contas Bancárias · DEV HUB</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/financeiro.css" />
  <link rel="stylesheet" href="css/contas-bancarias.css" />
</head>
<body data-page="contas-bancarias">
  <div class="app__body">
    <main class="content fin-content">

      <!-- ================= HEADER ================= -->
      <header class="fin-head">
        <div>
          <span class="fin-head__eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M2.5 10h19"/>
            </svg>
            Financeiro
          </span>
          <h1 class="fin-head__title">Contas Bancárias</h1>
          <p class="fin-head__sub">Cadastro, saldos e movimentações por conta.</p>
        </div>
        <div class="fin-head__actions">
          <button type="button" class="fin-btn fin-btn--ghost" id="cb-refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
            Atualizar
          </button>
          <button type="button" class="fin-btn fin-btn--primary" id="cb-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Nova conta
          </button>
        </div>
      </header>

      <!-- ================= KPIs ================= -->
      <section class="cb-kpis" id="cb-kpis" aria-label="Resumo"></section>

      <!-- ================= LISTA ================= -->
      <section class="cb-panel" aria-label="Contas cadastradas">
        <div class="cb-panel__scroll">
          <table class="cb-table">
            <thead>
              <tr>
                <th scope="col">Conta</th>
                <th scope="col">Banco</th>
                <th scope="col">Tipo</th>
                <th scope="col">Agência / Conta</th>
                <th scope="col" class="cell--num">Saldo inicial</th>
                <th scope="col" class="cell--num">Saldo atual</th>
                <th scope="col">Última mov.</th>
                <th scope="col" class="cell--right">Ações</th>
              </tr>
            </thead>
            <tbody id="cb-tbody">
              <tr><td colspan="8"><div class="fin-loading">Carregando...</div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav/config.js"></script>
<script src="js/nav/state.js"></script>
<script src="js/nav/roles.js"></script>
<script src="js/nav/styles.js"></script>
<script src="js/nav/permission-modal.js"></script>
<script src="js/nav/tabs.js"></script>
<script src="js/nav/module-menu.js"></script>
<script src="js/nav/notifications.js"></script>
<script src="js/nav/user-menu.js"></script>
<script src="js/nav/search.js"></script>
<script src="js/nav/org-switcher.js"></script>
<script src="js/nav/bar.js"></script>
<script src="js/nav/favorites.js"></script>
<script src="js/nav/main.js"></script>
  <script src="js/contas-bancarias.js"></script>
</body>
</html>
