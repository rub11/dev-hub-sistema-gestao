  <!-- SCRIPT DE INJEÇÃO DO NOME E CARGO -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        // Usa a leitura do sessionStorage, que é muito mais rápida, síncrona e não quebra
        const rawUser = sessionStorage.getItem('devhub_user');
        
        if (rawUser) {
          const user = JSON.parse(rawUser);
          
          // Pega o nome
          const fullName = user.name || 'Usuário';
          const firstName = fullName.trim().split(' ')[0];
          
          const nameEl = document.getElementById('greeting-name');
          if (nameEl) nameEl.textContent = firstName;

          // Pega o cargo (role)
          const roleEl = document.getElementById('greeting-role');
          if (roleEl && user.role) {
            // Deixa a primeira letra maiúscula (ex: admin -> Admin)
            const roleText = user.role.charAt(0).toUpperCase() + user.role.slice(1);
            roleEl.textContent = roleText;
            roleEl.hidden = false; 
          }
        }
      } catch (e) {
        console.error('Erro ao carregar dados do usuário no HTML:', e);
      }
    });
  </script>
