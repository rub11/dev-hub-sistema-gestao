<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Vendas · DEV HUB</title>

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/clientes.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/topnav.css" />
  <link rel="stylesheet" href="css/portal-vendas.css" />

  <script>
    (function () {
      try {
        if (!/[?&]blocked=1/.test(location.search)) {
          document.documentElement.classList.add('layout-topnav');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="layout-topnav" data-page="portal-vendas">

  <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

  <div class="app__body">
    <main class="content" id="main">

      <div class="portal-vendas__head page-head">
        <div>
          <!-- CORREÇÃO AQUI: Estrutura para o script preencher o nome e cargo -->
          <p class="page-head__eyebrow">
            Olá, <span id="greeting-name">...</span>
            <span class="role-badge" id="greeting-role" hidden></span>
          </p>
          <h1 class="page-head__title">Portal de Vendas</h1>
          <p class="page-head__sub">Escolha o que deseja visualizar.</p>
        </div>
      </div>

      <div class="portal-grid">
        
        <!-- Card: Vendas -->
        <a href="vendas.html" class="portal-card portal-card--vendas">
          <div class="portal-card__glow"></div>
          <div class="portal-card__icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
          </div>
          <div class="portal-card__body">
            <h3 class="portal-card__title">Vendas</h3>
            <p class="portal-card__desc">Acompanhe as vendas ativas, filtre por período, cliente e forma de pagamento.</p>
          </div>
          <div class="portal-card__badge" id="badge-count-vendas">6</div>
          <div class="portal-card__arrow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>

        <!-- Card: Orçamentos -->
        <a href="orcamentos.html" class="portal-card portal-card--orcamentos">
          <div class="portal-card__glow"></div>
          <div class="portal-card__icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="portal-card__body">
            <h3 class="portal-card__title">Orçamentos</h3>
            <p class="portal-card__desc">Gerencie orçamentos emitidos, acompanhe pendentes e aprove propostas.</p>
          </div>
          <div class="portal-card__badge" id="badge-count-orcamentos">2</div>
          <div class="portal-card__arrow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>

      </div>
    </main>
  </div>

  <!-- Scripts Base -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  
  <!-- Scripts do Topnav (caso o portal tenha a barra de navegação no topo) -->
  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
  <script src="js/nav/favorites.js"></script>
  <script src="js/nav/main.js"></script>

  <!-- SCRIPT DE INJEÇÃO DO NOME E CARGO -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Aguarda a autenticação do Supabase carregar
        if (window.Auth && window.Auth.readyPromise) {
          await Auth.readyPromise;
          
          // Puxa os dados do usuário logado
          const { data: { user } } = await window.supabase.auth.getUser();
          
          if (user) {
            // Pega o nome (tenta full_name, name ou o prefixo do email)
            const fullName = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
            const firstName = fullName.split(' ')[0];
            
            // Pega a role (pode vir do user_metadata ou você pode buscar no banco)
            const role = user.user_metadata?.role || 'Membro';

            const nameEl = document.getElementById('greeting-name');
            if (nameEl) nameEl.textContent = firstName;

            const roleEl = document.getElementById('greeting-role');
            if (roleEl) {
              roleEl.textContent = role;
              roleEl.hidden = false; // Torna o crachá visível
            }
          }
        }
      } catch (e) {
        console.error('Erro ao carregar dados do usuário:', e);
      }
    });
  </script>

</body>

</html>
