<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Vendas · DEV HUB</title>

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/clientes.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal-vendas.css" />

  <script>
    (function () {
      try {
        if (!/[?&]blocked=1/.test(location.search)) {
          document.documentElement.classList.add('layout-topnav');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="layout-topnav" data-page="portal-vendas">

  <a class="skip-link" href="#main">Pular para o conteúdo principal</a>

  <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="app__body">

    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menu-toggle"
              aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" /></svg>
      </button>

      <span class="topbar__brand">DEV HUB</span>

      <div class="topbar__actions">
        <button type="button" class="icon-btn" id="notifications-btn"
                aria-label="Notificações" title="Em breve" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
            <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
          </svg>
        </button>

        <div class="user-menu">
          <button type="button" class="user-menu__trigger" id="user-menu-trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-panel">
            <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
            <span class="user-menu__meta">
              <span class="user-menu__name" id="user-name">Carregando…</span>
              <span class="user-menu__role" id="user-role"></span>
            </span>
            <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <div class="user-menu__panel" id="user-menu-panel" role="menu" hidden>
            <button type="button" class="menu-item" role="menuitem" aria-disabled="true">
              Perfil <span class="menu-item__tag">Em breve</span>
            </button>
            <a class="menu-item" role="menuitem" href="configuracoes.html">Configurações</a>
            <div class="menu-item__sep" role="separator"></div>
            <button type="button" class="menu-item menu-item--danger" role="menuitem" data-action="logout">
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="main">

      <div id="global-alert" class="alert" role="alert" hidden></div>

      <div class="page-head portal-vendas__head">
        <p class="page-head__eyebrow">
          <span id="greeting-name">Olá</span>
          <span class="role-badge" id="greeting-role" hidden></span>
        </p>
        <h1 class="page-head__title">Portal de Vendas</h1>
        <p class="page-head__sub">Escolha o que deseja visualizar.</p>
      </div>

      <div class="portal-grid portal-grid--lg" role="list">

        <!-- VENDAS -->
        <a class="portal-card portal-card--vendas portal-card--lg" href="vendas.html" role="listitem">
          <div class="portal-card__glow" aria-hidden="true"></div>
          <div class="portal-card__icon portal-card__icon--lg">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="20" r="1.4"/>
              <circle cx="18" cy="20" r="1.4"/>
              <path d="M2.5 3.5h2.3l2.3 11.6a1.8 1.8 0 0 0 1.8 1.4h8.8a1.8 1.8 0 0 0 1.8-1.4L21 7.5H6"/>
            </svg>
          </div>
          <div class="portal-card__body">
            <h3 class="portal-card__title portal-card__title--lg">Vendas</h3>
            <p class="portal-card__desc">Acompanhe as vendas ativas, filtre por período, cliente e forma de pagamento.</p>
          </div>
          <div class="portal-card__badge portal-card__badge--lg" id="count-vendas">—</div>
          <div class="portal-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>

        <!-- ORÇAMENTOS -->
        <a class="portal-card portal-card--orcamentos portal-card--lg" href="orcamentos.html" role="listitem">
          <div class="portal-card__glow" aria-hidden="true"></div>
          <div class="portal-card__icon portal-card__icon--lg">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2.5H7A2 2 0 0 0 5 4.5v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5z"/>
              <path d="M14 2.5v5h5"/>
              <path d="M9 13h6M9 17h4"/>
            </svg>
          </div>
          <div class="portal-card__body">
            <h3 class="portal-card__title portal-card__title--lg">Orçamentos</h3>
            <p class="portal-card__desc">Gerencie orçamentos emitidos, acompanhe pendentes e aprove propostas.</p>
          </div>
          <div class="portal-card__badge portal-card__badge--lg" id="count-orcamentos">—</div>
          <div class="portal-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>

      </div>

    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>

  <script src="js/nav/config.js"></script>
  <script src="js/nav/state.js"></script>
  <script src="js/nav/roles.js"></script>
  <script src="js/nav/styles.js"></script>
  <script src="js/nav/permission-modal.js"></script>
  <script src="js/nav/tabs.js"></script>
  <script src="js/nav/module-menu.js"></script>
  <script src="js/nav/notifications.js"></script>
  <script src="js/nav/user-menu.js"></script>
  <script src="js/nav/search.js"></script>
  <script src="js/nav/org-switcher.js"></script>
  <script src="js/nav/bar.js"></script>
<script src="js/nav/favorites.js"></script>
  <script src="js/nav/main.js"></script>

  <script src="js/vendas/portal-vendas.js"></script>

</body>
</html>
